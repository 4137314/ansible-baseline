---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop conflicting firewall managers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [firewalld.service, ufw.service]
  when:
    - firewall_disable_conflicting
    - item in ansible_facts.services

- name: Write nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ firewall_config_path[ansible_os_family] | default('/etc/nftables.conf') }}"
    owner: root
    group: root
    mode: "0600"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
