---
- name: Create system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create install and textfile directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: root
    mode: "0755"
  loop:
    - {path: "{{ node_exporter_install_dir }}", owner: root}
    - {path: "{{ node_exporter_textfile_dir }}", owner: root}

- name: Download and verify release
  ansible.builtin.get_url:
    url: "{{ node_exporter_url }}/{{ node_exporter_release }}.tar.gz"
    dest: "/tmp/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_url }}/sha256sums.txt"
    mode: "0644"
  register: node_exporter_download
  check_mode: false

- name: Unpack binary
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_release }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ node_exporter_install_dir }}/node_exporter"
  notify: Restart node_exporter

- name: Install systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
