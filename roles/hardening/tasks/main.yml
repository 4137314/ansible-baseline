---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install OpenSSH server
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Ensure sshd reads drop-in configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/00-baseline.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reload sshd

- name: Ensure the privilege separation directory exists (needed by sshd -t)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == 'Debian'

- name: Validate the complete sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Ensure sysctl.d exists (absent on minimal images)
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Apply kernel hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-baseline.conf
    # Containers (e.g. Molecule) cannot change most kernel parameters.
    sysctl_set: "{{ ansible_virtualization_type not in ['docker', 'podman', 'container'] }}"
    reload: "{{ ansible_virtualization_type not in ['docker', 'podman', 'container'] }}"
  loop: "{{ hardening_sysctl | dict2items }}"

- name: Ensure modprobe.d exists (absent on minimal images)
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Blacklist rarely used network and bus kernel modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/90-baseline.conf
    content: |
      # Managed by mattiafait.baseline.hardening
      {% for module in hardening_blacklisted_modules %}
      install {{ module }} /bin/false
      {% endfor %}
    owner: root
    group: root
    mode: "0644"

- name: Configure automatic updates
  ansible.builtin.include_tasks: "updates-{{ ansible_os_family | lower }}.yml"
  when: hardening_auto_updates and ansible_os_family in ['Debian', 'RedHat']
