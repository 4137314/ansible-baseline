---
driver:
  name: docker
platforms:
  - name: debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: rocky9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: ""
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        users_operators:
          - name: alice
            admin: true
            keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMolecule0000000000000000000000000000000000 alice@test"]
            groups: [deploy]
        users_revoked: [mallory]
        firewall_rules:
          - {port: 22, proto: tcp, from: [10.0.0.0/8, "fd00::/8"]}
          - {port: 9100, proto: tcp, from: [10.0.10.5/32]}
        restic_repository: /srv/restic
        restic_password: 'te"st$pass'
        restic_paths: [/etc/hostname]
verifier:
  name: ansible
scenario:
  test_sequence: [dependency, destroy, create, prepare, converge, idempotence, verify, destroy]
